<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#eef5c5"/>

  <!-- Background logo silhouette -->
  <defs>
    <radialGradient id="bg-grad" gradientUnits="userSpaceOnUse" cx="918" cy="408" r="600">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
    <mask id="bg-mask">
      <rect width="1280" height="800" fill="url(#bg-grad)"/>
    </mask>
  </defs>
  <g mask="url(#bg-mask)">
    <g transform="translate(450, 0) scale(12)" opacity="0.06">
      <rect x="0" y="0" width="10" height="68" rx="5" fill="#0f1010"/>
      <path d="M 17,34 C 25,5 33,5 39,34 C 45,63 53,63 61,34"
            stroke="#0f1010" stroke-width="10" stroke-linecap="round" fill="none"/>
      <rect x="68" y="0" width="10" height="68" rx="5" fill="#0f1010"/>
    </g>
  </g>

  <!-- Small logo -->
  <g transform="translate(1078, 180) scale(0.8)" opacity="0.5">
    <rect x="0" y="0" width="10" height="68" rx="5" fill="#0f1010"/>
    <path d="M 17,34 C 25,5 33,5 39,34 C 45,63 53,63 61,34"
          stroke="#0f1010" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="68" y="0" width="10" height="68" rx="5" fill="#0f1010"/>
  </g>

  <!-- Headline -->
  <text x="1140" y="320" text-anchor="end" font-family="Archivo" font-size="56" font-weight="600" fill="#0f1010" letter-spacing="-1">Shape the</text>
  <text x="1140" y="388" text-anchor="end" font-family="Archivo" font-size="56" font-weight="600" fill="#0f1010" letter-spacing="-1">sound</text>
  <!-- Subtitle -->
  <text x="1140" y="430" text-anchor="end" font-family="Archivo" font-size="18" font-weight="400" fill="#0f1010" opacity="0.45">Stack delay, reverb, and more.</text>
  <text x="1140" y="454" text-anchor="end" font-family="Archivo" font-size="18" font-weight="400" fill="#0f1010" opacity="0.45">Toggle and tweak each effect in real time.</text>

  <!-- Panel mockup -->
  <g transform="translate(120, 50)">
    <!-- Shadow + panel -->
    <rect x="6" y="10" width="360" height="700" rx="16" fill="#000" opacity="0.08"/>
    <rect width="360" height="700" rx="16" fill="#0f1010" stroke="#1e2020" stroke-width="1"/>

    <!-- Header -->
    <text x="20" y="32" font-family="Archivo" font-size="15" font-weight="600" fill="#f5fad9" letter-spacing="-0.3">Sampler</text>
    <g transform="translate(320, 10)">
      <rect width="28" height="28" rx="8" fill="#161818" stroke="#1e2020" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="none" stroke="#f5fad9" stroke-width="1.5" opacity="0.35"/>
      <circle cx="14" cy="14" r="1.5" fill="none" stroke="#f5fad9" stroke-width="1.5" opacity="0.35"/>
    </g>
    <g transform="translate(278, 10)">
      <rect width="36" height="28" rx="8" fill="#161818" stroke="#1e2020" stroke-width="1"/>
      <text x="18" y="18" text-anchor="middle" font-family="Archivo" font-size="11" fill="#f5fad9" opacity="0.5">New</text>
    </g>
    <line x1="0" y1="48" x2="360" y2="48" stroke="#1e2020" stroke-width="1"/>

    <!-- FxChain card -->
    <rect x="20" y="60" width="320" height="420" rx="16" fill="#161818" stroke="#1e2020" stroke-width="1"/>
    <!-- Header -->
    <text x="36" y="82" font-family="Archivo" font-size="11" font-weight="600" fill="#f5fad9" opacity="0.5" letter-spacing="1">EFFECTS</text>
    <g transform="translate(276, 68)">
      <rect width="52" height="24" rx="8" fill="#0f1010" stroke="#1e2020" stroke-width="1"/>
      <g transform="translate(10, 8)" opacity="0.5">
        <line x1="0" y1="4" x2="8" y2="4" stroke="#f5fad9" stroke-width="1.5"/>
        <line x1="4" y1="0" x2="4" y2="8" stroke="#f5fad9" stroke-width="1.5"/>
      </g>
      <text x="30" y="16" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.5">FX</text>
    </g>

    <!-- Delay FxCard (enabled, expanded) -->
    <rect x="28" y="100" width="304" height="128" rx="10" fill="none" stroke="#eef5c5" stroke-width="1" opacity="0.4"/>
    <g transform="translate(40, 112)" fill="#f5fad9" opacity="0.35">
      <circle cx="0" cy="0" r="1.2"/><circle cx="4" cy="0" r="1.2"/>
      <circle cx="0" cy="3" r="1.2"/><circle cx="4" cy="3" r="1.2"/>
      <circle cx="0" cy="6" r="1.2"/><circle cx="4" cy="6" r="1.2"/>
    </g>
    <circle cx="56" cy="115" r="4" fill="#b7feae"/>
    <text x="68" y="119" font-family="Archivo" font-size="12" font-weight="500" fill="#f5fad9" letter-spacing="-0.3">Delay</text>
    <g transform="translate(310, 111)" opacity="0.35">
      <polyline points="0,2 4,6 8,2" fill="none" stroke="#f5fad9" stroke-width="1.8"/>
    </g>
    <line x1="28" y1="130" x2="332" y2="130" stroke="#1e2020" stroke-width="1"/>
    <g transform="translate(36, 140)">
      <text x="0" y="10" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">Time</text>
      <rect x="52" y="4" width="200" height="4" rx="2" fill="#1e2020"/>
      <rect x="52" y="4" width="80" height="4" rx="2" fill="#eef5c5" opacity="0.4"/>
      <circle cx="132" cy="6" r="5" fill="#eef5c5"/>
      <text x="268" y="10" text-anchor="end" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">250ms</text>
    </g>
    <g transform="translate(36, 162)">
      <text x="0" y="10" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">Feedback</text>
      <rect x="52" y="4" width="200" height="4" rx="2" fill="#1e2020"/>
      <rect x="52" y="4" width="100" height="4" rx="2" fill="#eef5c5" opacity="0.4"/>
      <circle cx="152" cy="6" r="5" fill="#eef5c5"/>
      <text x="268" y="10" text-anchor="end" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">40%</text>
    </g>
    <g transform="translate(36, 184)">
      <text x="0" y="10" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">Mix</text>
      <rect x="52" y="4" width="200" height="4" rx="2" fill="#1e2020"/>
      <rect x="52" y="4" width="60" height="4" rx="2" fill="#eef5c5" opacity="0.4"/>
      <circle cx="112" cy="6" r="5" fill="#eef5c5"/>
      <text x="268" y="10" text-anchor="end" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">25%</text>
    </g>

    <!-- Reverb FxCard (enabled, expanded) -->
    <rect x="28" y="240" width="304" height="128" rx="10" fill="none" stroke="#eef5c5" stroke-width="1" opacity="0.4"/>
    <g transform="translate(40, 252)" fill="#f5fad9" opacity="0.35">
      <circle cx="0" cy="0" r="1.2"/><circle cx="4" cy="0" r="1.2"/>
      <circle cx="0" cy="3" r="1.2"/><circle cx="4" cy="3" r="1.2"/>
      <circle cx="0" cy="6" r="1.2"/><circle cx="4" cy="6" r="1.2"/>
    </g>
    <circle cx="56" cy="255" r="4" fill="#b7feae"/>
    <text x="68" y="259" font-family="Archivo" font-size="12" font-weight="500" fill="#f5fad9" letter-spacing="-0.3">Reverb</text>
    <g transform="translate(310, 251)" opacity="0.35">
      <polyline points="0,2 4,6 8,2" fill="none" stroke="#f5fad9" stroke-width="1.8"/>
    </g>
    <line x1="28" y1="270" x2="332" y2="270" stroke="#1e2020" stroke-width="1"/>
    <g transform="translate(36, 280)">
      <text x="0" y="10" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">Room Size</text>
      <rect x="62" y="4" width="190" height="4" rx="2" fill="#1e2020"/>
      <rect x="62" y="4" width="114" height="4" rx="2" fill="#eef5c5" opacity="0.4"/>
      <circle cx="176" cy="6" r="5" fill="#eef5c5"/>
      <text x="268" y="10" text-anchor="end" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">60%</text>
    </g>
    <g transform="translate(36, 302)">
      <text x="0" y="10" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">Decay</text>
      <rect x="62" y="4" width="190" height="4" rx="2" fill="#1e2020"/>
      <rect x="62" y="4" width="76" height="4" rx="2" fill="#eef5c5" opacity="0.4"/>
      <circle cx="138" cy="6" r="5" fill="#eef5c5"/>
      <text x="268" y="10" text-anchor="end" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">40%</text>
    </g>
    <g transform="translate(36, 324)">
      <text x="0" y="10" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">Mix</text>
      <rect x="62" y="4" width="190" height="4" rx="2" fill="#1e2020"/>
      <rect x="62" y="4" width="57" height="4" rx="2" fill="#eef5c5" opacity="0.4"/>
      <circle cx="119" cy="6" r="5" fill="#eef5c5"/>
      <text x="268" y="10" text-anchor="end" font-family="Archivo" font-size="10" fill="#f5fad9" opacity="0.35">30%</text>
    </g>

    <!-- Reverse FxCard (disabled, collapsed) -->
    <rect x="28" y="380" width="304" height="36" rx="10" fill="none" stroke="#1e2020" stroke-width="1"/>
    <g transform="translate(40, 392)" fill="#f5fad9" opacity="0.35">
      <circle cx="0" cy="0" r="1.2"/><circle cx="4" cy="0" r="1.2"/>
      <circle cx="0" cy="3" r="1.2"/><circle cx="4" cy="3" r="1.2"/>
      <circle cx="0" cy="6" r="1.2"/><circle cx="4" cy="6" r="1.2"/>
    </g>
    <circle cx="56" cy="398" r="4" fill="#1e2020" stroke="#f5fad9" stroke-width="0.5" opacity="0.5"/>
    <text x="68" y="402" font-family="Archivo" font-size="12" font-weight="500" fill="#f5fad9" opacity="0.5" letter-spacing="-0.3">Reverse</text>

    <!-- Add effect hint -->
    <rect x="28" y="428" width="304" height="36" rx="10" fill="none" stroke="#1e2020" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="180" y="450" text-anchor="middle" font-family="Archivo" font-size="12" font-weight="500" fill="#f5fad9" opacity="0.3" letter-spacing="-0.3">+ Add effect</text>
  </g>
</svg>
