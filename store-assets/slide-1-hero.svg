<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#0f1010"/>

  <!-- Background logo silhouette -->
  <defs>
    <radialGradient id="bg-grad" gradientUnits="userSpaceOnUse" cx="640" cy="390" r="600">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
    <mask id="bg-mask">
      <rect width="1280" height="800" fill="url(#bg-grad)"/>
    </mask>
  </defs>
  <g mask="url(#bg-mask)">
    <g transform="translate(250, 50) scale(10)" opacity="0.08">
      <rect x="0" y="0" width="10" height="68" rx="5" fill="#eef5c5"/>
      <path d="M 17,34 C 25,5 33,5 39,34 C 45,63 53,63 61,34"
            stroke="#eef5c5" stroke-width="10" stroke-linecap="round" fill="none"/>
      <rect x="68" y="0" width="10" height="68" rx="5" fill="#eef5c5"/>
    </g>
  </g>

  <!-- Small logo -->
  <g transform="translate(120, 180) scale(0.8)" opacity="0.5">
    <rect x="0" y="0" width="10" height="68" rx="5" fill="#eef5c5"/>
    <path d="M 17,34 C 25,5 33,5 39,34 C 45,63 53,63 61,34"
          stroke="#eef5c5" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="68" y="0" width="10" height="68" rx="5" fill="#eef5c5"/>
  </g>

  <!-- Headline -->
  <text x="120" y="320" font-family="Archivo" font-size="56" font-weight="600" fill="#eef5c5" letter-spacing="-1">Record from</text>
  <text x="120" y="388" font-family="Archivo" font-size="56" font-weight="600" fill="#eef5c5" letter-spacing="-1">any tab</text>
  <!-- Subtitle -->
  <text x="120" y="430" font-family="Archivo" font-size="18" font-weight="400" fill="#f5fad9" opacity="0.4">Capture audio from any browser tab</text>
  <text x="120" y="454" font-family="Archivo" font-size="18" font-weight="400" fill="#f5fad9" opacity="0.4">with a single tap. No permissions fuss.</text>

  <!-- Panel mockup -->
  <g transform="translate(740, 50)">
    <!-- Shadow + panel -->
    <rect x="6" y="10" width="360" height="700" rx="16" fill="#000" opacity="0.25"/>
    <rect width="360" height="700" rx="16" fill="#0f1010" stroke="#1e2020" stroke-width="1"/>

    <!-- Header -->
    <text x="20" y="32" font-family="Archivo" font-size="15" font-weight="600" fill="#f5fad9" letter-spacing="-0.3">Sampler</text>
    <g transform="translate(320, 10)">
      <rect width="28" height="28" rx="8" fill="#161818" stroke="#1e2020" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="none" stroke="#f5fad9" stroke-width="1.5" opacity="0.35"/>
      <circle cx="14" cy="14" r="1.5" fill="none" stroke="#f5fad9" stroke-width="1.5" opacity="0.35"/>
    </g>
    <line x1="0" y1="48" x2="360" y2="48" stroke="#1e2020" stroke-width="1"/>

    <!-- Record card (idle state) -->
    <rect x="20" y="72" width="320" height="220" rx="16" fill="#161818" stroke="#1e2020" stroke-width="1"/>

    <!-- Record button -->
    <circle cx="180" cy="160" r="32" fill="#eef5c5"/>
    <circle cx="180" cy="160" r="10" fill="#0f1010"/>

    <!-- Hint text -->
    <text x="180" y="240" text-anchor="middle" font-family="Archivo" font-size="12" fill="#f5fad9" opacity="0.35" letter-spacing="-0.3">tap to record this tab</text>
  </g>
</svg>
